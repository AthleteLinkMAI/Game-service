spring:
  application:
    name: game-service
  mvc:
    servlet:
      path: /api/v1
  
  datasource:
    url: jdbc:postgresql://localhost:5432/game_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        key-deserializer: org.apache.kafka.common.serealization.UUIDDeserializer
        value-deserializer: org.springframework.kafka.support.deserializer.JacksonJsonDeserializer

app:
  kafka:
    topics:
      user-changes: user.changes

server:
  port: 8082

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
springdoc:
  override-with-generic-response: false
